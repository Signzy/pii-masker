# Clippy lint configuration
# Run with: cargo clippy --all-targets --all-features -- -D warnings

# ── Complexity thresholds ────────────────────────────────────────────

# Cognitive complexity (nesting, branches, loops)
cognitive-complexity-threshold = 25

# Max number of arguments per function
too-many-arguments-threshold = 6

# Max lines per function / impl block
too-many-lines-threshold = 200

# Type complexity score threshold (composite types get too deep)
type-complexity-threshold = 250

# Max trait bounds on a single type parameter
max-trait-bounds = 5

# ── Error & size thresholds ──────────────────────────────────────────

# Max byte size for an Error enum variant before triggering large_error
large-error-threshold = 128

# Max byte size for types that should not live on the stack
stack-size-threshold = 512

# Max byte size for large enum variant differences
enum-variant-size-threshold = 200

# ── Misc ─────────────────────────────────────────────────────────────

# Disallowed types (none — ban nothing by default)
disallowed-types = []

# Max inline file size for include_str! / include_bytes!
max-include-file-size = 1_048_576
