# Source: https://en.wikipedia.org/wiki/CPF_number
# CPF: 11 digits; two mod-11 check digits

[[recognizer]]
entity = "BR_CPF"
country = "BR"
regex = '\b[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}[-.]?[0-9]{2}\b'
validator = "br_cpf"
score = 0.85
context = ["cpf", "cadastro pessoas fisicas", "documento"]
enabled = true
examples = ["529.982.247-25", "111.444.777-35", "046.704.780-45"]
counter_examples = ["111.111.111-11", "000.000.000-00", "529.982.247-26"]
mask = { kind = "redact" }

