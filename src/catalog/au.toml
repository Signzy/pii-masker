# AU_TFN weights [1,4,3,7,5,8,6,9,10]; sum%11==0
# 123456782: 1+8+9+28+25+48+42+72+20=253; 253%11=0 ✓
# 123450005: 1+8+9+28+25+0+0+0+50=121; 121%11=0 ✓
# 112233443: 1+4+6+14+15+24+24+36+30=154; 154%11=0 ✓

[[recognizer]]
entity = "AU_ABN"
country = "AU"
regex = '\b[0-9]{2}[ ]?[0-9]{3}[ ]?[0-9]{3}[ ]?[0-9]{3}\b'
validator = "au_abn"
score = 0.85
context = ["abn", "australian business number", "business number"]
enabled = true
examples = ["51824753556", "51 824 753 556", "83914571673"]
counter_examples = ["51824753557", "11824753556", "12345678901"]
mask = { kind = "redact" }

[[recognizer]]
entity = "AU_ACN"
country = "AU"
regex = '\b[0-9]{3}[ ]?[0-9]{3}[ ]?[0-9]{3}\b'
validator = "au_acn"
score = 0.85
context = ["acn", "australian company number", "company number"]
enabled = true
examples = ["004085616", "010499966", "000000019"]
counter_examples = ["004085617", "000000001", "111111112"]
mask = { kind = "redact" }

[[recognizer]]
entity = "AU_TFN"
country = "AU"
regex = '\b[0-9]{3}[ ]?[0-9]{3}[ ]?[0-9]{2,3}\b'
validator = "au_tfn"
