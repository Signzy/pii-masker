# Source: https://microsoft.github.io/presidio/supported_entities/
#
# IN_AADHAAR Verhoeff-verified 12-digit examples (algorithm trace verified):
#   234567890124 (c=0 ✓), 200000000013 (c=0 ✓), 298765432101 (c=0 ✓)
# IN_GSTIN: 27AAPFU0939F1ZV verified via base-36 mod-36 algorithm

[[recognizer]]
entity = "IN_PAN"
country = "IN"
regex = '\b[A-Z]{5}[0-9]{4}[A-Z]\b'
validator = "none"
score = 0.85
context = ["pan", "permanent account", "income tax"]
enabled = true
examples = ["ABCDE1234F", "AAAAA0000A", "ZNBKR5566A"]
counter_examples = ["ABCDE12345", "12345ABCDE", "ABCD1234F"]
mask = { kind = "redact" }

[[recognizer]]
entity = "IN_AADHAAR"
country = "IN"
regex = '\b[2-9][0-9]{3}[ ]?[0-9]{4}[ ]?[0-9]{4}\b'
validator = "verhoeff"
score = 0.85
context = ["aadhaar", "aadhar", "uid", "uidai"]
enabled = true
examples = ["234567890124", "200000000013", "298765432101"]
counter_examples = ["234567890125", "1234567890123", "abcdefghijkl"]
mask = { kind = "redact" }

[[recognizer]]
entity = "IN_GSTIN"
country = "IN"
regex = '\b[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]Z[0-9A-Z]\b'
validator = "gstin"
score = 0.85
context = ["gstin", "gst", "tax", "goods and services"]
enabled = true
examples = ["27AAPFU0939F1ZV", "27AAPFU0939F1ZV", "27AAPFU0939F1ZV"]
counter_examples = ["27AAPFU0939F1ZW", "00AAACM3084B1ZM", "invalid"]
mask = { kind = "redact" }

[[recognizer]]
entity = "IN_VOTER"
country = "IN"
regex = '\b[A-Z]{3}[0-9]{7}\b'
validator = "none"
score = 0.50
context = ["voter", "epic", "election", "voter id"]
enabled = true
examples = ["ABC1234567", "XYZ9876543", "DEF0000001"]
counter_examples = ["AB1234567", "ABCD123456", "12345678901"]
mask = { kind = "redact" }
