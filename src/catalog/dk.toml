# Source: https://en.wikipedia.org/wiki/Personal_identification_number_(Denmark)

[[recognizer]]
entity = "DK_CPR"
country = "DK"
regex = '\b[0-3][0-9][0-1][0-9][0-9]{2}[-]?[0-9]{4}\b'
